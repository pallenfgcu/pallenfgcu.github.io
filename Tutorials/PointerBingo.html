<!DOCTYPE html>
<html lang="en">
<head>
    <title>Paul Allen FGCU</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <link href="https://www.w3schools.com/w3css/4/w3.css" rel="stylesheet">
    <link href="https://www.w3schools.com/lib/w3-theme-teal.css" rel="stylesheet">
    <link crossorigin="anonymous" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
          integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZxpXtYSLy85pkm9GaYVYMfw5BC1A=="
          referrerpolicy="no-referrer" rel="stylesheet"/>
    <link href="/Resources/pallenfgcu.css" rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script type="application/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script type="application/javascript" src="/Resources/nav_sidebar.js"></script>

    <link href="assets/pointer_bingo.css" rel="stylesheet">
    <script type="application/javascript" src="/Tutorials/assets/pointer_bingo.js"></script>

    <script>
        let bingo;
        let bingoRow = 0;
        let pendingReveal = false;
        let pendingMemory = null;
        let pendingChangedAddress = null;
        let pendingValid = true;

        const POINTER_COUNT_HTML = 3;
        const VARIABLE_COUNT_HTML = 4;
        const ARRAY_COUNT_HTML = 12;
        const MEMORY_SIZE_HTML = POINTER_COUNT_HTML + VARIABLE_COUNT_HTML + ARRAY_COUNT_HTML;
        const POINTER_START_HTML = 0;
        const VARIABLE_START_HTML = POINTER_START_HTML + POINTER_COUNT_HTML;
        const ARRAY_START_HTML = VARIABLE_START_HTML + VARIABLE_COUNT_HTML;

        $(document).ready(function () {
            bingo = new PointerBingo(15);

            buildBingoTableHeader($('#tabPtrBingo').find('thead'));
            buildBingoTableFooter($('#tabPtrBingo').find('tfoot'));

            $('#tabPtrBingo').find('tfoot').hide();
            addBingoTableRow(null, bingo.memory, true);
        });

        function buildBingoTableHeader(tableSection) {
            tableSection.empty();

            const titleRow = $('<tr>');
            titleRow.append($('<th>').attr('rowspan', '3').text('RND'));
            titleRow.append($('<th>').attr('rowspan', '3').text('Instruction'));
            titleRow.append($('<th>').attr('rowspan', '3').text('INV'));
            titleRow.append($('<th>').attr('colspan', MEMORY_SIZE_HTML).text('Memory Addresses'));
            tableSection.append(titleRow);

            const variableRow = $('<tr>');

            for (let i = 0; i < POINTER_COUNT_HTML; i++) {
                variableRow.append($('<th>').attr('class', 'pointer_bingo_mem pointer_bingo_ptr').text(`ptr${i + 1}`));
            }

            for (let i = 0; i < VARIABLE_COUNT_HTML; i++) {
                variableRow.append($('<th>').attr('class', 'pointer_bingo_mem pointer_bingo_var').text(`var${i + 1}`));
            }

            variableRow.append($('<th>')
                .attr('class', 'pointer_bingo_left pointer_bingo_array')
                .attr('colspan', ARRAY_COUNT_HTML)
                .text('array[]'));

            tableSection.append(variableRow);
            tableSection.append(buildAddressRow());
        }

        function buildBingoTableFooter(tableSection) {
            tableSection.empty();

            const addressRow = $('<tr>');
            addressRow.append($('<th>').attr('rowspan', '3').text('RND'));
            addressRow.append($('<th>').attr('rowspan', '3').text('Instruction'));
            addressRow.append($('<th>').attr('rowspan', '3').text('INV'));

            for (let i = 0; i < MEMORY_SIZE_HTML; i++) {
                addressRow.append($('<th>').attr('class', getMemoryHeaderClass(i)).text(`0x${toHex(i)}`));
            }

            tableSection.append(addressRow);

            const variableRow = $('<tr>');

            for (let i = 0; i < POINTER_COUNT_HTML; i++) {
                variableRow.append($('<th>').attr('class', 'pointer_bingo_mem pointer_bingo_ptr').text(`ptr${i + 1}`));
            }

            for (let i = 0; i < VARIABLE_COUNT_HTML; i++) {
                variableRow.append($('<th>').attr('class', 'pointer_bingo_mem pointer_bingo_var').text(`var${i + 1}`));
            }

            variableRow.append($('<th>')
                .attr('class', 'pointer_bingo_left pointer_bingo_array')
                .attr('colspan', ARRAY_COUNT_HTML)
                .text('array[]'));

            tableSection.append(variableRow);

            const titleRow = $('<tr>');
            titleRow.append($('<th>').attr('colspan', MEMORY_SIZE_HTML).text('Memory Addresses'));
            tableSection.append(titleRow);
        }

        function buildAddressRow() {
            const addressRow = $('<tr>');

            for (let i = 0; i < MEMORY_SIZE_HTML; i++) {
                addressRow.append($('<th>').attr('class', getMemoryHeaderClass(i)).text(`0x${toHex(i)}`));
            }

            return addressRow;
        }

        function getMemoryHeaderClass(address) {
            let className = 'pointer_bingo_mem';

            if (address < VARIABLE_START_HTML) {
                className += ' pointer_bingo_ptr';
            }
            else if (address < ARRAY_START_HTML) {
                className += ' pointer_bingo_var';
            }
            else {
                className += ' pointer_bingo_array';
            }

            return className;
        }

        function addBingoTableRow(instruction = null, memoryValues = bingo.memory, revealValues = true) {
            const tabBingo = $('#tabPtrBingo').find('tbody');
            const rowBingo = $('<tr>').attr('id', `rnd_${bingo.round}_row`);

            rowBingo.append($('<td>').text(`${bingo.round}`));
            rowBingo.append($('<td>')
                .attr('class', 'pointer_bingo_instruction')
                .text(instruction === null ? '' : instruction));

            const bingoInvalid = $('<td>');

            if (instruction) {
                bingoInvalid.append($('<input>')
                    .attr('id', `rnd_${bingo.round}_invalid`)
                    .attr('type', 'checkbox')
                    .attr('class', 'bingo_text_cell'));
            }

            rowBingo.append(bingoInvalid);

            for (let i = 0; i < memoryValues.length; i++) {
                const bingoCell = $('<td>')
                    .attr('id', `rnd_${bingo.round}_cell_${i}`)
                    .attr('class', getMemoryCellClass(i, false));

                if (bingo.round === 0) {
                    bingoCell.text(formatMemoryValue(i, memoryValues[i]));
                }
                else {
                    bingoCell.append($('<input>')
                        .attr('id', `rnd_${bingo.round}_mem_${i}`)
                        .attr('type', 'text')
                        .attr('size', '2')
                        .attr('class', 'bingo_text_cell')
                        .val(revealValues ? formatMemoryValue(i, memoryValues[i]) : ''));
                }

                rowBingo.append(bingoCell);
            }

            tabBingo.append(rowBingo);
        }

        function revealBingoTableRow(round, memoryValues, changedAddress, validInstruction) {
            const invalidCheckbox = $(`#rnd_${round}_invalid`);

            if (!validInstruction) {
                invalidCheckbox.prop('checked', true);
            }

            for (let i = 0; i < memoryValues.length; i++) {
                const input = $(`#rnd_${round}_mem_${i}`);
                const cell = $(`#rnd_${round}_cell_${i}`);

                input.val(formatMemoryValue(i, memoryValues[i]));
                cell.attr('class', getMemoryCellClass(i, changedAddress === i));

                if (changedAddress === i) {
                    input.addClass('pointer_bingo_changed_value');
                }
            }
        }

        function getMemoryCellClass(address, changed = false) {
            let className = 'pointer_bingo_cell';

            if (address < VARIABLE_START_HTML) {
                className += ' pointer_bingo_ptr_cell';
            }
            else if (address < ARRAY_START_HTML) {
                className += ' pointer_bingo_var_cell';
            }
            else {
                className += ' pointer_bingo_array_cell';
            }

            if (changed) {
                className += ' pointer_bingo_changed_cell';
            }

            return className;
        }

        function formatMemoryValue(address, value) {
            if (address < VARIABLE_START_HTML) {
                return `0x${toHex(value)}`;
            }

            return toHex(value);
        }

        function nextClick() {
            if (!pendingReveal) {
                const previousMemory = bingo.memory.slice();
                const instruction = bingo.nextInstruction();

                pendingMemory = bingo.memory.slice();
                pendingChangedAddress = bingo.lastChangedAddress;
                pendingValid = bingo.lastInstructionWasValid;
                pendingReveal = true;

                addBingoTableRow(instruction, previousMemory, false);
                $('#ptr_bingo_next').text('Reveal Changes');
            }
            else {
                revealBingoTableRow(bingo.round, pendingMemory, pendingChangedAddress, pendingValid);

                pendingReveal = false;
                pendingMemory = null;
                pendingChangedAddress = null;
                pendingValid = true;

                ++bingoRow;
                $('#ptr_bingo_next').text('Next Instruction');

                if (bingoRow >= 10) {
                    $('#tabPtrBingo').find('tfoot').show();
                }
            }
        }
    </script>
</head>
<body>
<!-- Side Navigation -->
<nav-sidebar></nav-sidebar>

<!-- Header -->
<header class="w3-container w3-theme w3-padding" id="myHeader">
    <i class="fa fa-bars w3-large w3-button w3-theme" onclick="nav_sidebar_open()"></i>
    <div class="w3-center">
        <h1 class="w3-large w3-animate-bottom">Pointer Bingo</h1>
    </div>
</header>

<div class="w3-row w3-small w3-margin">
    <div class="w3-card">
        <div class="w3-row">
            <div class="w3-container w3-cell w3-padding pointer_bingo" style="min-width: 480px; min-height: 350px; overflow-x: auto;">
                <table id="tabPtrBingo">
                    <thead></thead>
                    <tbody></tbody>
                    <tfoot></tfoot>
                </table>
            </div>
        </div>
        <div class="w3-row w3-padding">
            <div class="w3-container w3-cell">
                <button id="ptr_bingo_next" onclick="nextClick()">Next Instruction</button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="w3-container w3-theme-dark">
    <h5><a class="w3-text-white" href="https://www.fgcu.edu" target="_blank">Florida Gulf Coast University</a><br>
        <a class="w3-text-white" href="https://www.fgcu.edu/eng/softwareengineering/" target="_blank">U.A. Whitaker Department of Computing & Software
            Engineering</a></h5>
    <div class="w3-tooltip w3-right" style="position:relative;bottom:55px;">
        <span class="w3-text w3-theme w3-padding">Go To Top</span>&nbsp;
        <a class="w3-text-white" href="#myHeader"><span class="w3-large">
        <i class="fa fa-chevron-circle-up"></i></span></a>
    </div>
</footer>
</body>
</html>
